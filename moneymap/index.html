<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyMap | Christy's Personal Finance Tracker</title>
<style>
:root{--bg:#faf7f2;--card:#fffdf9;--text:#292724;--muted:#817a72;--line:#e8e1d8;--terra:#c9785d;--sage:#7d9478;--soft:#f1dfd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 12px 40px #392a1f0b}.auth .card{width:min(420px,100%)}.brand{font-weight:800;font-size:24px}.brand b{color:var(--terra)}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700}.primary{background:var(--terra);color:#fff}.secondary{background:#f1ece5;color:var(--text)}.layout{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:24px 16px;border-right:1px solid var(--line);background:#fcfaf6}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;margin:4px 0}.nav button.active,.nav button:hover{background:var(--soft)}main{padding:28px;max-width:1200px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.metric{padding:18px}.metric strong{font-size:25px;display:block;margin-top:7px}.section{margin-top:18px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#f0ece6}.progress{height:8px;background:#eee7df;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--sage)}.msg{margin-top:12px}.modal{position:fixed;inset:0;background:#29272455;display:grid;place-items:center;padding:20px;z-index:10}.modal .card{width:min(520px,100%)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid4,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:18px}.grid4,.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="root"></div><div id="modal"></div>
<script>
const URL="https://mqtauhmzsjfjfcfqppdm.supabase.co";
const KEY="sb_publishable_6YyswjIgsHpsu--SMVv2bA_TTtTp3MH";
const root=document.getElementById("root"), modalEl=document.getElementById("modal");
let token=null,user=null,view="dashboard",month=new Date(),txSearch="",txType="",txAccount="",txCategory="";
let data={accounts:[],categories:[],transactions:[],budgets:[],goals:[]};
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const headers=()=>({"apikey":KEY,"Authorization":"Bearer "+token,"Accept-Profile":"moneymap"});
async function api(path,opts={}){
  const h={...headers(),...(opts.headers||{})};
  if(opts.body)h["Content-Type"]="application/json";
  const r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:h});
  const text=await r.text();
  let body=null;try{body=text?JSON.parse(text):null}catch{}
  if(!r.ok)throw new Error(body?.message||body?.hint||body?.error_description||text||("Request failed: "+r.status));
  return body;
}
async function authApi(path,body){
  const r=await fetch(URL+"/auth/v1/"+path,{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const text=await r.text();let b=null;try{b=text?JSON.parse(text):null}catch{}
  if(!r.ok)throw new Error(b?.msg||b?.message||b?.error_description||text||("Authentication failed: "+r.status));
  return b;
}
function monthStart(){return new Date(month.getFullYear(),month.getMonth(),1).toISOString().slice(0,10)}
function monthEnd(){return new Date(month.getFullYear(),month.getMonth()+1,0).toISOString().slice(0,10)}
function greet(){let h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night"}
async function load(){
  data.accounts=await api("accounts?select=*&order=created_at.desc")||[];
  data.categories=await api("categories?select=*&order=created_at.desc")||[];
  data.transactions=await api("transactions?select=*&transaction_date=gte."+monthStart()+"&transaction_date=lte."+monthEnd()+"&order=transaction_date.desc")||[];
  data.budgets=await api("budgets?select=*&period_start=gte."+monthStart()+"&period_start=lt."+new Date(month.getFullYear(),month.getMonth()+1,1).toISOString().slice(0,10))||[];
  data.goals=await api("goals?select=*&order=created_at.desc")||[];
}
function saveSession(s){token=s.access_token;user=s.user;localStorage.setItem("moneymap_session",JSON.stringify(s))}
function clearSession(){token=null;user=null;localStorage.removeItem("moneymap_session")}
function auth(){
return '<div class="auth"><div class="card"><div class="brand">Money<b>Map</b></div><h1>Welcome back</h1><p class="muted">Your private personal finance space.</p><form id="authform"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="pass" type="password" minlength="6" required><button class="btn primary" style="width:100%;margin-top:18px">Sign in</button><div id="authmsg" class="muted msg"></div></form><button class="btn secondary" id="signup" style="width:100%;margin-top:10px">Create an account</button></div></div>';
}
function app(){
return '<div class="layout"><aside class="side"><div class="brand" style="padding:8px 12px 20px">Money<b>Map</b></div><nav class="nav">'+["dashboard","accounts","transactions","categories","budgets","goals"].map(v=>'<button class="'+(view===v?"active":"")+'" onclick="go(\''+v+'\')">'+v[0].toUpperCase()+v.slice(1)+'</button>').join("")+'</nav><button class="btn secondary" style="margin:24px 12px;width:calc(100% - 24px)" onclick="logout()">Sign out</button></aside><main><div class="top"><div><div class="muted">'+greet()+'</div><h1>'+esc(user?.user_metadata?.full_name||"Christy")+'</h1></div><div><button class="btn secondary" onclick="changeMonth(-1)">‹</button> <b>'+month.toLocaleString("en-US",{month:"long",year:"numeric"})+'</b> <button class="btn secondary" onclick="changeMonth(1)">›</button></div></div>'+page()+'</main></div>';
}
function page(){if(view==="dashboard")return dashboard();if(view==="accounts")return accounts();if(view==="transactions")return transactions();if(view==="categories")return categories();if(view==="budgets")return budgets();return goals()}
function sum(type){return data.transactions.filter(t=>t.transaction_type===type&&t.status!=="archived").reduce((a,t)=>a+Number(t.amount||0),0)}
function metric(a,b){return '<section class="card metric"><span class="muted">'+a+'</span><strong>'+b+'</strong></section>'}
function accountName(id){return data.accounts.find(a=>a.id===id)?.name||"Account"}
function categoryName(id){return data.categories.find(c=>c.id===id)?.name||"Uncategorized"}
function listTx(n,list=data.transactions){if(!list.length)return '<p class="muted">No transactions match the current filters.</p>';return '<div class="list">'+list.slice(0,n).map(t=>'<div class="row"><div><b>'+esc(t.description||categoryName(t.category_id))+'</b><div class="muted">'+t.transaction_date+' · '+accountName(t.account_id)+(t.transaction_type==="transfer"?' → '+accountName(t.transfer_account_id):'')+'</div></div><div style="text-align:right"><b>'+((t.transaction_type==="expense")?"-":t.transaction_type==="transfer"?"":"+")+money(t.amount)+'</b><div style="margin-top:5px"><button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="txModal(\''+t.id+'\')">Edit</button> <button class="btn secondary" style="padding:5px 8px;font-size:12px" onclick="archiveTx(\''+t.id+'\')">Archive</button></div></div></div>').join("")+'</div>'}
function dashboard(){let inc=sum("income"),exp=sum("expense");return '<div class="grid4">'+metric("Income",money(inc))+metric("Spending",money(exp))+metric("Net cash flow",money(inc-exp))+metric("Transfers",money(data.transactions.filter(t=>t.transaction_type==="transfer").reduce((a,t)=>a+Number(t.amount||0),0)))+'</div><div class="grid2 section"><section class="card"><h2>Recent activity</h2>'+listTx(6)+'</section><section class="card"><h2>Budget progress</h2>'+budgetSummary()+'</section></div><section class="card section"><h2>Goals</h2>'+goalSummary()+'</section>'}
function accounts(){return '<div class="top"><h1>Accounts</h1><button class="btn primary" onclick="accountModal()">Add account</button></div><section class="card list">'+(data.accounts.length?data.accounts.map(a=>'<div class="row"><div><b>'+esc(a.name)+'</b><div class="muted">'+esc(a.account_type)+' · '+esc(a.currency)+'</div></div><b>'+money(Number(a.opening_balance)+accountMovement(a.id))+'</b></div>').join(""):'<p class="muted">No accounts yet. Add your first account.</p>')+'</section>'}
function accountMovement(id){return data.transactions.filter(t=>t.status!=="archived"&&(t.account_id===id||t.transfer_account_id===id)).reduce((a,t)=>{if(t.transaction_type==="transfer")return a+(t.account_id===id?-1:1)*Number(t.amount||0);return a+(t.transaction_type==="expense"?-1:1)*Number(t.amount||0)},0)}
function transactions(){let filtered=data.transactions.filter(t=>{let q=txSearch.toLowerCase();return (!q||String(t.description||"").toLowerCase().includes(q)||categoryName(t.category_id).toLowerCase().includes(q))&&(!txType||t.transaction_type===txType)&&(!txAccount||t.account_id===txAccount)&&(!txCategory||t.category_id===txCategory)});return '<div class="top"><h1>Transactions</h1><button class="btn primary" onclick="txModal()">Add transaction</button></div><section class="card"><div class="grid2" style="margin-bottom:16px"><div><label>Search</label><input value="'+esc(txSearch)+'" oninput="txSearch=this.value;render()"></div><div><label>Type</label><select onchange="txType=this.value;render()"><option value="">All types</option><option value="income" '+(txType==="income"?"selected":"")+'>Income</option><option value="expense" '+(txType==="expense"?"selected":"")+'>Expense</option><option value="transfer" '+(txType==="transfer"?"selected":"")+'>Transfer</option></select></div><div><label>Account</label><select onchange="txAccount=this.value;render()"><option value="">All accounts</option>'+data.accounts.map(a=>'<option value="'+a.id+'" '+(txAccount===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div><div><label>Category</label><select onchange="txCategory=this.value;render()"><option value="">All categories</option>'+data.categories.map(a=>'<option value="'+a.id+'" '+(txCategory===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div></div>'+listTx(100,filtered)+'</section>'}
function categories(){return '<div class="top"><h1>Categories</h1><button class="btn primary" onclick="catModal()">Add category</button></div><div class="grid2">'+["expense","income"].map(type=>'<section class="card"><h2>'+type[0].toUpperCase()+type.slice(1)+'</h2><div class="list">'+data.categories.filter(c=>c.category_type===type).map(c=>'<div class="row"><span>'+esc(c.name)+'</span><span class="pill">'+type+'</span></div>').join("")+'</div></section>').join("")+'</div>'}
function budgets(){return '<div class="top"><h1>Budgets</h1><button class="btn primary" onclick="budgetModal()">Add budget</button></div><section class="card list">'+(data.budgets.length?data.budgets.map(b=>{let spent=data.transactions.filter(t=>t.transaction_type==="expense"&&t.category_id===b.category_id).reduce((a,t)=>a+Number(t.amount),0),p=Number(b.amount)?Math.min(100,spent/Number(b.amount)*100):0;return '<div><div class="row"><div><b>'+esc(categoryName(b.category_id))+'</b><div class="muted">'+money(spent)+' of '+money(b.amount)+'</div></div><b>'+Math.round(p)+'%</b></div><div class="progress"><i style="width:'+p+'%"></i></div></div>'}).join(""):'<p class="muted">No budgets for this month.</p>')+'</section>'}
function goals(){return '<div class="top"><h1>Goals</h1><button class="btn primary" onclick="goalModal()">Add goal</button></div><section class="card list">'+(data.goals.length?data.goals.map(g=>{let p=Number(g.target_amount)?Math.min(100,Number(g.current_amount)/Number(g.target_amount)*100):0;return '<div><div class="row"><div><b>'+esc(g.name)+'</b><div class="muted">'+money(g.current_amount)+' of '+money(g.target_amount)+'</div></div><b>'+Math.round(p)+'%</b></div><div class="progress"><i style="width:'+p+'%"></i></div></div>'}).join(""):'<p class="muted">No active goals yet.</p>')+'</section>'}
function budgetSummary(){return data.budgets.length?data.budgets.map(b=>'<div class="row"><span>'+esc(categoryName(b.category_id))+'</span><b>'+money(b.amount)+'</b></div>').join(""):'<p class="muted">No budgets set for this month.</p>'}
function goalSummary(){return data.goals.length?data.goals.slice(0,5).map(g=>'<div class="row"><span>'+esc(g.name)+'</span><b>'+money(g.current_amount)+' / '+money(g.target_amount)+'</b></div>').join(""):'<p class="muted">Create a goal to start tracking progress.</p>'}
function modal(title,body){modalEl.innerHTML='<div class="modal"><div class="card"><h2>'+title+'</h2>'+body+'<div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" id="save">Save</button></div></div></div>'}
function closeModal(){modalEl.innerHTML=""}
function accountModal(){modal("Add account",'<label>Name</label><input id="an"><label>Type</label><select id="at"><option>bank</option><option>cash</option><option>savings</option><option>investment</option><option>wallet</option><option>other</option></select><label>Currency</label><input id="ac" value="NGN"><label>Opening balance</label><input id="ab" type="number" value="0">');$("save").onclick=async()=>{try{await api("accounts",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,name:$("an").value,account_type:$("at").value,currency:$("ac").value,opening_balance:Number($("ab").value)})});closeModal();await load();render()}catch(e){alert(e.message)}}}
function txModal(id){let t=id?data.transactions.find(x=>x.id===id):null;let opts=data.accounts.map(a=>'<option value="'+a.id+'" '+(t?.account_id===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join(""),cats=data.categories.map(c=>'<option value="'+c.id+'" '+(t?.category_id===c.id?"selected":"")+'>'+esc(c.name)+'</option>').join(""),targets=data.accounts.map(a=>'<option value="'+a.id+'" '+(t?.transfer_account_id===a.id?"selected":"")+'>'+esc(a.name)+'</option>').join("");modal(id?"Edit transaction":"Add transaction",'<label>Type</label><select id="tt" onchange="toggleTransfer()"><option value="expense" '+(t?.transaction_type==="expense"?"selected":"")+'>Expense</option><option value="income" '+(t?.transaction_type==="income"?"selected":"")+'>Income</option><option value="transfer" '+(t?.transaction_type==="transfer"?"selected":"")+'>Transfer</option></select><label>Account</label><select id="ta">'+opts+'</select><div id="transferTarget" class="'+(t?.transaction_type==="transfer"?"":"hidden")+'"><label>Transfer to</label><select id="tr">'+targets+'</select></div><label>Category</label><select id="tc"><option value="">No category</option>'+cats+'</select><label>Amount</label><input id="tm" type="number" step="0.01" value="'+(t?.amount??"")+'"><label>Date</label><input id="td" type="date" value="'+(t?.transaction_date||new Date().toISOString().slice(0,10))+'"><label>Description</label><input id="txd" value="'+esc(t?.description||"")+'">');$("save").onclick=async()=>{try{let type=$("tt").value,source=$("ta").value,target=type==="transfer"?$("tr").value:null;if(type==="transfer"&&!target)throw new Error("Select the account receiving the transfer.");if(type==="transfer"&&source===target)throw new Error("Source and destination accounts must be different.");let payload={account_id:source,transfer_account_id:target,category_id:type==="transfer"?null:($("tc").value||null),transaction_type:type,amount:Number($("tm").value),currency:"NGN",transaction_date:$("td").value,description:$("txd").value,status:"approved",transfer_direction:type==="transfer"?"outgoing":null};if(!payload.amount||payload.amount<=0)throw new Error("Enter an amount greater than zero.");if(id){await api("transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)})}else{payload.user_id=user.id;await api("transactions",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify(payload)})}closeModal();await load();render()}catch(e){alert(e.message)}};toggleTransfer()}async function archiveTx(id){if(!confirm("Archive this transaction? It will remain in your history but be excluded from totals."))return;try{await api("transactions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({status:"archived"})});await load();render()}catch(e){alert(e.message)}}
function toggleTransfer(){let box=$("transferTarget"),type=$("tt")?.value;if(box)box.classList.toggle("hidden",type!=="transfer");}
function catModal(){modal("Add category",'<label>Name</label><input id="cn"><label>Type</label><select id="ct"><option value="expense">Expense</option><option value="income">Income</option></select>');$("save").onclick=async()=>{try{await api("categories",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,name:$("cn").value,category_type:$("ct").value})});closeModal();await load();render()}catch(e){alert(e.message)}}}
function budgetModal(){let cats=data.categories.filter(c=>c.category_type==="expense").map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("");modal("Add budget",'<label>Category</label><select id="bc">'+cats+'</select><label>Amount</label><input id="ba" type="number" step="0.01"><label>Month</label><input id="bm" type="month" value="'+monthStart().slice(0,7)+'">');$("save").onclick=async()=>{try{await api("budgets",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,category_id:$("bc").value,period_start:$("bm").value+"-01",amount:Number($("ba").value)})});closeModal();await load();render()}catch(e){alert(e.message)}}}
function goalModal(){modal("Add goal",'<label>Name</label><input id="gn"><label>Target amount</label><input id="ga" type="number"><label>Target date</label><input id="gd" type="date"><label>Type</label><select id="gt"><option value="financial">Financial</option><option value="monthly">Monthly</option></select>');$("save").onclick=async()=>{try{await api("goals",{method:"POST",headers:{"Prefer":"return=minimal","Content-Profile":"moneymap"},body:JSON.stringify({user_id:user.id,name:$("gn").value,target_amount:Number($("ga").value),current_amount:0,target_date:$("gd").value||null,goal_type:$("gt").value,status:"active"})});closeModal();await load();render()}catch(e){alert(e.message)}}}
function go(v){view=v;render()}
async function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);try{await load();render()}catch(e){alert(e.message)}}
async function logout(){clearSession();render()}
function render(){root.innerHTML=user?app():auth();if(!user){$("authform").onsubmit=async e=>{e.preventDefault();$("authmsg").textContent="Signing in...";try{let s=await authApi("token?grant_type=password",{email:$("email").value,password:$("pass").value});saveSession(s);await load();render()}catch(err){$("authmsg").textContent=err.message}};$("signup").onclick=async()=>{let email=prompt("Email address");if(!email)return;let pass=prompt("Create a password");if(!pass)return;try{let s=await authApi("signup",{email,password:pass});if(s.access_token){saveSession(s);await load();render()}else alert("Account created. Check your email to confirm.")}catch(err){alert(err.message)}}}}
async function start(){let saved=localStorage.getItem("moneymap_session");if(saved){try{let s=JSON.parse(saved);token=s.access_token;user=s.user;await load();render();return}catch(e){clearSession()}}render()}
start().catch(e=>{root.innerHTML='<div class="auth"><div class="card"><div class="brand">Money<b>Map</b></div><h1>MoneyMap could not start</h1><p class="muted">'+esc(e.message)+'</p><button class="btn secondary" onclick="location.reload()">Reload</button></div></div>'});
</script>
</body>
</html>
